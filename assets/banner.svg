<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
	<title id="title">Mahenul Haque Chowdhury (arnob.life)</title>
	<desc id="desc">A gradient banner with subtle glow and the text Mahenul Haque Chowdhury (arnob.life) — Founder &amp; CEO at GrayVally Software solutions, Lead Engineer</desc>

	<defs>
		<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#6366F1"/>
			<stop offset="50%" stop-color="#8B5CF6"/>
			<stop offset="100%" stop-color="#EC4899"/>
		</linearGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="18" result="b"/>
			<feMerge>
				<feMergeNode in="b"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
		<filter id="noise" x="0" y="0" width="100%" height="100%">
			<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
			<feColorMatrix type="saturate" values="0"/>
			<feComponentTransfer>
				<feFuncA type="table" tableValues="0 0.05"/>
			</feComponentTransfer>
		</filter>
		<linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#E0E7FF"/>
			<stop offset="100%" stop-color="#FCE7F3"/>
		</linearGradient>
	</defs>

	<rect x="0" y="0" width="1200" height="300" fill="#0B0B0F"/>
	<rect x="0" y="0" width="1200" height="300" fill="url(#g)" opacity="0.25"/>
	<rect x="6" y="6" width="1188" height="288" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" rx="20"/>

	<g filter="url(#glow)">
		<path d="M-100 260 Q 400 140 900 240 T 1400 210" fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="6"/>
		<path d="M-120 80 Q 380 0 880 90 T 1420 70" fill="none" stroke="#F472B6" stroke-opacity="0.28" stroke-width="6"/>
	</g>

	<rect x="0" y="0" width="1200" height="300" filter="url(#noise)" opacity="0.15"/>

	<g transform="translate(80, 100)">
		<text x="0" y="0" fill="url(#textGrad)" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="0.5">
			Mahenul Haque Chowdhury (arnob.life)
		</text>
		<text x="0" y="42" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
			Founder &amp; CEO at GrayVally Software solutions, Lead Engineer
		</text>
	</g>

	<circle cx="1100" cy="60" r="70" fill="url(#g)" opacity="0.25"/>
	<circle cx="1100" cy="60" r="40" fill="url(#g)" opacity="0.45"/>
</svg>
