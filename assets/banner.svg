<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
	<title id="title">Mahenul Haque Chowdhury</title>
	<desc id="desc">Banner for Mahenul Haque Chowdhury - Founder &amp; CEO at GrayVally</desc>

	<defs>
		<linearGradient id="mainGrad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#4F46E5"/> <stop offset="50%" stop-color="#9333EA"/> <stop offset="100%" stop-color="#DB2777"/> </linearGradient>
		<linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#E0E7FF"/>
			<stop offset="100%" stop-color="#FAE8FF"/>
		</linearGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="14" result="coloredBlur"/>
			<feMerge>
				<feMergeNode in="coloredBlur"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<rect x="0" y="0" width="1200" height="300" fill="#0F172A"/> <rect x="0" y="0" width="1200" height="300" fill="url(#mainGrad)" opacity="0.15"/>
	
	<rect x="4" y="4" width="1192" height="292" fill="none" stroke="url(#mainGrad)" stroke-width="2" rx="16" opacity="0.4"/>

	<circle cx="100" cy="50" r="80" fill="#4F46E5" opacity="0.2" filter="url(#glow)"/>
	<circle cx="1100" cy="250" r="100" fill="#DB2777" opacity="0.15" filter="url(#glow)"/>
	
	<g transform="translate(600, 150)" text-anchor="middle">
		<text y="-20" fill="url(#textGrad)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="1" filter="url(#glow)">
			MAHENUL HAQUE CHOWDHURY
		</text>
		<text y="40" fill="#A5B4FC" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="2">
			FOUNDER &amp; CEO @ GRAYVALLY • LEAD ENGINEER
		</text>
		<text y="75" fill="#94A3B8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
			( arnob.life )
		</text>
	</g>
</svg>
