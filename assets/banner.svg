<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
	<title id="title">Mahenul Haque Chowdhury</title>
	<desc id="desc">Banner for Mahenul Haque Chowdhury - Founder &amp; CEO at GrayVally</desc>

	<defs>
		<linearGradient id="mainGrad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#06B6D4"/> <stop offset="50%" stop-color="#3B82F6"/> <stop offset="100%" stop-color="#7C3AED"/> </linearGradient>
		<linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#E0F2FE"/>
			<stop offset="100%" stop-color="#C7D2FE"/>
		</linearGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="16" result="coloredBlur"/>
			<feMerge>
				<feMergeNode in="coloredBlur"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<rect x="0" y="0" width="1200" height="300" fill="#020617"/> <rect x="0" y="0" width="1200" height="300" fill="url(#mainGrad)" opacity="0.12"/>
	
	<rect x="4" y="4" width="1192" height="292" fill="none" stroke="url(#mainGrad)" stroke-width="2" rx="16" opacity="0.5"/>

	<circle cx="0" cy="300" r="200" fill="#06B6D4" opacity="0.15" filter="url(#glow)"/>
	<circle cx="1200" cy="0" r="200" fill="#7C3AED" opacity="0.15" filter="url(#glow)"/>
	
	<g transform="translate(600, 150)" text-anchor="middle">
		<text y="-25" fill="url(#textGrad)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="1.5" filter="url(#glow)">
			MAHENUL HAQUE CHOWDHURY
		</text>
		<text y="35" fill="#38BDF8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3">
			FOUNDER &amp; CEO @ GRAYVALLY •
		</text>
		<text y="75" fill="#94A3B8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
			( arnob.life )
		</text>
	</g>
</svg>
